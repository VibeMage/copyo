<!doctype html>
<!-- record-review-video.sh 在本机起一个 HTTP 服务把这页给模拟器里的 Safari 打开，
     UI 测试在这里复制文字、链接和图片，再切回 Copyo。文案是虚构的行程笔记。 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekend in Lisbon</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 17px/1.5 -apple-system, system-ui, sans-serif; color: #1c1c1e; background: #f2f2f7; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 8px 0 4px; }
  .sub { color: #6e6e73; margin: 0 0 20px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin: 0 0 16px; }
  .card h2 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #6e6e73; margin: 0 0 6px; }
  .card p { margin: 0; }
  button { margin-top: 12px; font: 600 16px -apple-system, system-ui, sans-serif; color: #fff; background: #0a84ff;
           border: 0; border-radius: 10px; padding: 10px 18px; }
  a { color: #0a84ff; }
  img { display: block; width: 100%; border-radius: 10px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Weekend in Lisbon</h1>
  <p class="sub">Trip notes for Saturday</p>

  <section class="card">
    <h2>Meeting point</h2>
    <p id="meet">Meet at Praça do Comércio at 10:30. Tram 28 leaves from Martim Moniz.</p>
    <button id="copy-meet" aria-label="Copy meeting point" onclick="copyMeet(this)">Copy</button>
  </section>

  <section class="card">
    <h2>Read before you go</h2>
    <p><a href="https://en.wikipedia.org/wiki/Lisbon">Lisbon on Wikipedia</a></p>
  </section>

  <section class="card">
    <h2>Sunset at Miradouro</h2>
    <img id="photo" src="sunset.jpg" alt="Sunset over the hills">
    <button id="copy-photo" aria-label="Copy photo" onclick="copyPhoto(this)">Copy</button>
  </section>
</main>
<script>
  // Safari 的剪贴板只收 PNG；ClipboardItem 要在点击的当下建好，内容可以是之后才兑现的 Promise
  function copyPhoto(button) {
    const img = document.getElementById("photo");
    const png = new Promise(resolve => {
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext("2d").drawImage(img, 0, 0);
      canvas.toBlob(resolve, "image/png");
    });
    navigator.clipboard.write([new ClipboardItem({ "image/png": png })]).then(() => copied(button, "Copy photo"));
  }

  function copied(button, label) {
    // 无障碍名字也跟着变：UI 测试靠它判断这一下确实复制成功了
    button.textContent = "Copied";
    button.setAttribute("aria-label", "Copied");
    setTimeout(() => {
      button.textContent = "Copy";
      button.setAttribute("aria-label", label);
    }, 3000);
  }

  function copyMeet(button) {
    navigator.clipboard.writeText(document.getElementById("meet").textContent)
      .then(() => copied(button, "Copy meeting point"));
  }
</script>
</body>
</html>
