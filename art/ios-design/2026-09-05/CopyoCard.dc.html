<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;border-radius:12px;overflow:hidden;padding:{{ pad }};background:{{ tint }};box-shadow:{{ ring }};box-sizing:border-box;height:100%;transform:{{ tf }};opacity:{{ op }}">
<div style="display:flex;align-items:center;gap:6px;margin-bottom:{{ hgap }}"><span style="display:flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 6px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;background:{{ color }};color:{{ onBand }}">{{ glyph }}{{ kindLabel }}</span><span style="flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{ sec }}">{{ meta }}</span>{{ pinGlyph }}</div>
<sc-if value="{{ isText }}" hint-placeholder-val="{{ true }}"><div style="font-size:{{ fs }};line-height:{{ lh }};color:{{ label }};display:-webkit-box;-webkit-line-clamp:{{ clamp }};-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;white-space:pre-line">{{ text }}</div></sc-if>
<sc-if value="{{ isMono }}" hint-placeholder-val="{{ false }}"><div style="font-family:'SF Mono',Menlo,ui-monospace,monospace;font-size:{{ fsm }};line-height:{{ lhm }};color:{{ label }};display:-webkit-box;-webkit-line-clamp:{{ clamp }};-webkit-box-orient:vertical;overflow:hidden;word-break:break-all">{{ text }}</div></sc-if>
<sc-if value="{{ isRich }}" hint-placeholder-val="{{ false }}"><div style="font-size:{{ fs }};line-height:{{ lh }};color:{{ label }}"><div style="font-weight:700">{{ title }}</div><div style="white-space:pre-line;font-size:{{ fs2 }};color:{{ sec2 }};display:-webkit-box;-webkit-line-clamp:{{ clamp }};-webkit-box-orient:vertical;overflow:hidden">{{ text }}</div></div></sc-if>
<sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:{{ fs }};line-height:{{ lh }};font-weight:600;color:{{ label }};display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{ title }}</div><div style="font-size:12px;color:#0A84FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ domain }}</div></div></sc-if>
<sc-if value="{{ isColor }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:{{ swH }};border-radius:8px;background:{{ hex }}"></div><div style="font-family:'SF Mono',Menlo,ui-monospace,monospace;font-size:{{ fs }};font-weight:600;color:{{ label }}">{{ hex }}</div></div></sc-if>
<sc-if value="{{ isImage }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:{{ imgH }};border-radius:8px;background:{{ imgBg }};position:relative;overflow:hidden"><div style="position:absolute;left:10px;right:10px;top:12px;height:8px;border-radius:4px;background:{{ imgLine }}"></div><div style="position:absolute;left:10px;right:10px;top:30px;bottom:12px;border-radius:6px;background:{{ imgBlock }}"></div></div><div style="font-size:12px;color:{{ sec }}">{{ metaImg }}</div></div></sc-if>
<sc-if value="{{ isFile }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:{{ fs }};font-weight:600;color:{{ label }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</div><div style="display:inline-flex;align-self:flex-start;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:{{ chipBg }};font-size:11px;font-weight:600;color:{{ sec }}">{{ macGlyph }}仅 Mac</div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:140},&quot;item&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;ClipItem&quot;},&quot;t&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;Theme&quot;},&quot;dense&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;en&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;foc&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lift&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pressed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ghost&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, it = p.item || {}, t = p.t || { dark: false, label: '#000', sec: 'rgba(60,60,67,.6)' };
    const d = !!p.dense, en = !!p.en, el = React.createElement;
    const svg = (paths, c, s, sw) => el('svg', { width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: c, strokeWidth: sw, strokeLinecap: 'round', strokeLinejoin: 'round', style: { flex: 'none' } }, ...paths.map((q, i) => el('path', typeof q === 'string' ? { key: i, d: q } : { key: i, ...q })));
    const G = { text: ['M4 6h16', 'M4 12h12', 'M4 18h8'], richText: ['M5 4h14', 'M12 4v16', 'M8 20h8'], link: ['M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1', 'M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1'], color: ['M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z', { d: 'M12 3a9 9 0 0 0 0 18z', fill: 'currentColor', stroke: 'none' }], image: ['M4 5h16v14H4z', 'M4 16l5-5 4 4 3-3 4 4'], file: ['M6 3h8l5 5v13H6z', 'M14 3v5h5'] };
    const KL = en ? { text: 'Text', richText: 'Rich', link: 'Link', color: 'Color', image: 'Image', file: 'File' } : { text: '文本', richText: '富文本', link: '链接', color: '颜色', image: '图片', file: '文件' };
    const color = it.color || '#8E8E93';
    const n = parseInt(color.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    const onBand = lum > 0.62 ? 'rgba(0,0,0,.78)' : '#fff';
    const dark = !!t.dark;
    const ring = p.sel ? '0 0 0 3px #0A84FF' : p.foc ? '0 0 0 2px #0A84FF, 0 0 0 5px rgba(10,132,255,.35)' : p.lift ? '0 12px 32px rgba(0,0,0,.28)' : 'none';
    return {
      pad: d ? '10px' : '12px', hgap: d ? '6px' : '10px',
      tint: dark ? `color-mix(in srgb, ${color} 20%, #1C1C1E)` : `color-mix(in srgb, ${color} 12%, #fff)`,
      ring, tf: p.lift ? 'scale(1.04) rotate(-2deg)' : p.pressed ? 'scale(.96)' : 'none', op: p.ghost ? .35 : 1,
      color, onBand, kindLabel: KL[it.kind] || '', glyph: svg(G[it.kind] || G.text, onBand, 11, 2.4),
      meta: `${en ? it.sourceEn || it.source : it.source} · ${en ? it.timeEn || it.time : it.time}`,
      pinGlyph: it.pinned ? svg(['M9 3h6l-1 6 3 3H7l3-3z', 'M12 12v9'], t.sec, 12, 2.2) : null,
      label: t.label, sec: t.sec, sec2: dark ? 'rgba(235,235,245,.85)' : 'rgba(60,60,67,.9)',
      fs: d ? '13px' : '15px', lh: d ? '17px' : '20px', fs2: d ? '12px' : '14px', fsm: d ? '11px' : '13px', lhm: d ? '15px' : '18px',
      clamp: d ? 3 : 6, swH: d ? '40px' : '80px', imgH: d ? '70px' : '160px',
      imgBg: dark ? 'linear-gradient(160deg,#2b3646,#3d3630 60%,#352d3f)' : 'linear-gradient(160deg,#d9e6f5,#f3e7d6 60%,#e6dcef)',
      imgLine: dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.08)', imgBlock: dark ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.55)',
      chipBg: dark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.06)', macGlyph: svg(['M3 4h18v12H3z', 'M9 20h6M12 16v4'], t.sec, 11, 2.2),
      text: it.text, title: it.title, domain: it.domain, hex: it.hex, metaImg: it.meta,
      isText: it.kind === 'text' && !it.mono, isMono: it.kind === 'text' && !!it.mono, isRich: it.kind === 'richText', isLink: it.kind === 'link', isColor: it.kind === 'color', isImage: it.kind === 'image', isFile: it.kind === 'file',
    };
  }
}
</script>
</body>
</html>
